<table class="table table-striped table-bordered">
  <thead>
    <tr>
      <th *ngFor="let header of headers">{{ header }}</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of data">
      <td *ngFor="let key of keys">
        {{ getCellValue(item, key) }}
      </td>
      <td>
        <ng-container *ngIf="isLivro">
          <button
            class="btn btn-sm btn-info me-2"
            (click)="editPreco.emit(item)"
          >
            Definir Preços
          </button>
        </ng-container>

        <button class="btn btn-sm btn-warning me-2" (click)="edit.emit(item)">
          Editar
        </button>
        <button class="btn btn-sm btn-danger" (click)="delete.emit(item)">
          Excluir
        </button>
      </td>
    </tr>
  </tbody>
</table>
