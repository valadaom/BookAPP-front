<div class="modal fade show d-block" tabindex="-1" *ngIf="show" style="background-color: rgba(0,0,0,0.5);">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-warning text-dark">
          <h5 class="modal-title">Editar {{ label }}</h5>
          <button type="button" class="btn-close" aria-label="Fechar" (click)="close.emit()"></button>
        </div>
        <div class="modal-body">
          <input
            type="text"
            class="form-control"
            [(ngModel)]="modelValue"
            [placeholder]="placeholder"
            autofocus
          />
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" (click)="close.emit()">Cancelar</button>
          <button class="btn btn-primary" (click)="save.emit(modelValue)">Salvar</button>
        </div>
      </div>
    </div>
  </div>
